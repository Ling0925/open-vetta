name: chat-runtime-delivery
on:
  push:
    branches: [feat/chat-runtime-switch]
    paths:
      - '.github/chat-runtime-handoff/**'
      - '.github/workflows/chat-runtime-delivery.yml'
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.repository == 'Ling0925/open-vetta' && github.ref == 'refs/heads/feat/chat-runtime-switch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d31851699e0b742187f2e332a6757719ef3533f3
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          source = Path('.github/chat-runtime-handoff')
          compressed = b''.join((source / f'part-{i:02d}').read_bytes() for i in range(8))
          assert hashlib.sha256(compressed).hexdigest() == 'f0d25d58f596a0804aa6ebce351a8c02058dbd2e5a75e7c9ee6b4ba14a4c2bed'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed, max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data and len(patch) == 182992
          assert hashlib.sha256(patch).hexdigest() == '9fcbe396800966487a9c4c8342d5c9f24f0e0b4c64d320c228f60301c8bff5c3'
          (Path(os.environ['RUNNER_TEMP']) / 'chat-runtime.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/chat-runtime.patch"
          git apply --index "$RUNNER_TEMP/chat-runtime.patch"
          git rm -- .github/chat-runtime-handoff/part-00 .github/chat-runtime-handoff/part-01 .github/chat-runtime-handoff/part-02 .github/chat-runtime-handoff/part-03 .github/chat-runtime-handoff/part-04 .github/chat-runtime-handoff/part-05 .github/chat-runtime-handoff/part-06 .github/chat-runtime-handoff/part-07 .github/workflows/chat-runtime-delivery.yml
          git diff --cached --check
          test "$(git write-tree)" = e3aebb9768305918bc42700d0af6cd87df45d6d2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): 在原会话中切换 Native 与 Codex 后端' -m '复用原消息流、输入框、停止与审批，将 Codex 作为完整执行引擎接入现有会话。按会话保存选择，切换交接原记录但不重放工具，失败不静默回退或并发启动。' -m '已执行 26 项定向离线回归；真实 Kernel 双向切换、React、固定 Codex 二进制和安装包入口测试交由原生 CI 验证，未宣称全套通过。'
          git rev-parse HEAD
          git show -s --format=%T HEAD
      - name: Fast-forward only the authorized fork branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ling0925/open-vetta
          test "$GITHUB_REF" = refs/heads/feat/chat-runtime-switch
          askpass="$RUNNER_TEMP/chat-runtime-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          remote="$(git ls-remote origin refs/heads/feat/chat-runtime-switch | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/chat-runtime-switch
