name: codex-preview-installers

on:
  push:
    branches: [fix/codex-preview-installers]

permissions:
  contents: read
  actions: read

jobs:
  export-macos-dmg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download verified macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Ling0925/open-vetta
          run-id: 36364441810
          name: codex-chat-darwin-arm64-79f2683e3a16d8444c558e51af0b00b3f7526361
          path: artifact
      - name: Keep only the DMG and its checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          find artifact -maxdepth 2 -type f -name '*.dmg' -print -exec cp '{}' export/ \;
          test -n "$(find export -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -f artifact/SHA256SUMS ]]; then
            cp artifact/SHA256SUMS export/SHA256SUMS
          fi
          ls -lh export
      - name: Upload macOS arm64 DMG only
        uses: actions/upload-artifact@v4
        with:
          name: Vetta-0.5.60-macOS-arm64-DMG
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
