name: chat-runtime-validation

on:
  push:
    branches: [feat/chat-runtime-switch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.repository == 'Ling0925/open-vetta'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the exact tracked source for reproducible review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chat-runtime-review"
          git archive --format=tar.gz --output="$RUNNER_TEMP/chat-runtime-review/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/chat-runtime-review/commit.txt"
          (cd "$RUNNER_TEMP/chat-runtime-review" && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: chat-runtime-review-source
          path: ${{ runner.temp }}/chat-runtime-review/
          retention-days: 2
          if-no-files-found: error
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace dependencies
        id: dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
      - name: Runtime and storage contracts
        run: bun run test:pkg runtime-node
      - name: Build the existing Desktop workspace dependency surface
        run: bun run --cwd apps/desktop prepare:workspace
      - name: Existing chat and session regression tests
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          bun scripts/quality/run-vitest.mjs --run --config apps/desktop/vitest.config.ts
          src/main/conversations src/main/agent-runtime src/main/codex-workspace
          src/renderer/domains/conversation src/renderer/root-layout src/preload/apis/session
          --reporter=default --reporter=junit --outputFile=chat-runtime-junit.xml
      - name: Existing quality gates
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          bun run check 2>&1 | tee chat-runtime-check.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-runtime-reports
          path: |
            apps/desktop/chat-runtime-junit.xml
            chat-runtime-junit.xml
            chat-runtime-check.txt
          if-no-files-found: ignore
          retention-days: 7
